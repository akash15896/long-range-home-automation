<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation · Sign in</title>
<style>
  :root { --bg: #f2f5f3; --surface: #fff; --fg: #17201b; --muted: #5d6a63; --line: #d5ddd8; --accent: #11795a; --error: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1412; --surface: #18201c; --fg: #e4ebe7; --muted: #98a69f; --line: #2a3530; --accent: #4cc79a; --error: #ff8a80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
         padding: 28px 24px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 1.3rem; }
  p { margin: 0; color: var(--muted); font-size: .9rem; }
  label { font-size: .85rem; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 6px;
          background: var(--bg); color: var(--fg); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--accent);
           color: #fff; cursor: pointer; }
  .error { color: var(--error); font-size: .9rem; min-height: 1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Automation</h1>
  <p>Sign in to control the LoRa master and relays.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <div class="error" role="alert">{{ERROR}}</div>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
